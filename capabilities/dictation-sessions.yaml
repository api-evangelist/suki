naftiko: 1.0.0-alpha2
info:
  label: Suki Dictation API — Sessions
  description: Open and close clinical dictation sessions on Suki Speech Service. Audio is streamed over the paired WebSocket endpoint.
  tags:
    - Suki
    - Dictation
    - Sessions
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
  - namespace: env
    keys:
      SUKI_SDP_TOKEN: SUKI_SDP_TOKEN
capability:
  consumes:
    - type: http
      namespace: dictation-sessions
      baseUri: https://sdp.suki-stage.com
      description: Suki Speech Service dictation session lifecycle.
      resources:
        - name: dictation-sessions
          path: /api/v1/dictation/sessions
          operations:
            - name: createdictation
              method: POST
              inputParameters:
                - { name: body, in: body, type: object, required: true }
              outputParameters:
                - { name: result, type: object, value: $. }
        - name: dictation-session-end
          path: /api/v1/dictation/sessions/{sessionId}/end
          operations:
            - name: enddictation
              method: POST
              inputParameters:
                - { name: sessionId, in: path, type: string, required: true }
              outputParameters:
                - { name: result, type: object, value: $. }
      authentication:
        type: apikey
        key: sdp_suki_token
        value: '{{env.SUKI_SDP_TOKEN}}'
        placement: header
  exposes:
    - type: mcp
      namespace: dictation-sessions-mcp
      port: 9090
      transport: http
      description: MCP adapter for Suki Dictation sessions.
      tools:
        - { name: suki-dictation-create-session, description: Create a clinical dictation session, hints: { readOnly: false, destructive: false, idempotent: false }, call: dictation-sessions.createdictation, with: { body: tools.body } }
        - { name: suki-dictation-end-session, description: End a dictation session and return final transcript, hints: { readOnly: false, destructive: false, idempotent: true }, call: dictation-sessions.enddictation, with: { sessionId: tools.sessionId } }
