aid: suki
name: Suki AI
description: >-
  Suki is a Redwood City, California healthcare AI company building ambient
  clinical intelligence for clinicians. Founded in 2017 by Punit Soni
  (CEO, former Google and Flipkart) and Karthik Rajan (former Salesforce),
  Suki has raised $168M+ across Series A-D from Venrock, March Capital,
  First Round Capital, MedStar Health, and others. The company's flagship
  product is Suki Assistant, an AI-powered voice-enabled scribe and
  documentation assistant that listens to doctor-patient conversations
  and generates specialty-specific clinical notes, patient instructions,
  orders, and codes — claimed to cut documentation time by 72% across
  100+ specialties. Beyond the end-user assistant, Suki ships Suki
  Platform (also called Suki for Partners), a developer platform whose
  Suki Speech Service exposes ambient documentation, dictation, and
  form-filling capabilities as REST APIs, WebSocket audio-streaming
  endpoints, webhooks, and SDKs (Web, Headless Web, Mobile iOS, Mobile
  Android beta, Dictation iframe) so healthcare technology companies can
  embed Suki's voice AI into their own EHR, telehealth, RCM, or vet-tech
  applications. Suki has bidirectional ambient integrations with the four
  leading EHRs — Epic, Oracle Health (Cerner), athenahealth, and
  MEDITECH — plus partnerships with Amwell, Zoom, HealthEdge, WellSky,
  MEDENT, and Bond Vet, and is deployed at 400+ health systems and
  partners with a 70%+ clinician adoption rate.
