apis:
- aid: suki:suki-dictation-api
  name: Suki Dictation API
  description: >-
    REST + WebSocket API for real-time clinical dictation. Partners open a dictation session, stream audio
    to a WebSocket, and receive transcribed clinical text. Designed for both in-field dictation (into
    a single EHR field) and scratchpad mode for free-form capture. Also exposed through the Suki Dictation
    SDK as a hosted iframe for fast web integration.
  humanURL: https://developer.suki.ai/api-reference/ambient-dictation
  baseURL: https://sdp.suki-stage.com/api/v1/
  tags:
  - Dictation
  - Speech Recognition
  - WebSocket
  - Clinical Voice
  properties:
  - type: Documentation
    url: https://developer.suki.ai/api-reference/ambient-dictation
  - type: OpenAPI
    url: openapi/suki-dictation-api-openapi.yml
  - type: AsyncAPI
    url: asyncapi/suki-asyncapi.yml
  - type: SDKs
    url: https://developer.suki.ai/dictation-sdk/introduction
    name: Suki Dictation SDK (@suki-sdk/dictation-react, Beta)
- aid: suki:suki-auth-api
  name: Suki Auth API
  description: >-
    Authentication and token-issuance endpoints used by partners and partner-managed providers to obtain
    access tokens for the Suki Speech Service. Issues JWTs, exposes JWKS for verification, and registers
    provider accounts. Every call to Ambient, Dictation, and Form Filling APIs carries the partner token
    in the `sdp_suki_token` header.
  humanURL: https://developer.suki.ai/api-reference/authentication
  baseURL: https://sdp.suki-stage.com/api/v1/
  tags:
  - Authentication
  - Tokens
  - JWT
  - JWKS
  properties:
  - type: Documentation
    url: https://developer.suki.ai/api-reference/authentication
  - type: OpenAPI
    url: openapi/suki-auth-api-openapi.yml
- aid: suki:suki-info-api
  name: Suki Info API
  description: >-
    Reference/lookup endpoints that expose Suki-curated clinical metadata used to drive note generation,
    ordering, and form filling. Covers supported specialties, diagnoses, encounter and visit types, LOINC
    note sections, provider roles, medication orders, order coding systems, dosage units, and form templates.
  humanURL: https://developer.suki.ai/api-reference/information
  baseURL: https://sdp.suki-stage.com/api/v1/
  tags:
  - Reference Data
  - Metadata
